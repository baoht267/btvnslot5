<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 7 - Cards Columns</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="exercise7.css" />
  </head>
  <body>
    <main class="container-fluid cards-shell px-0 py-0">
      <h1 class="page-title">Cards Columns</h1>

      <div class="row row-cols-1 row-cols-lg-3 cards-row g-4">
        <div class="col">
            <div class="card demo-card card-blue h-100">
              <div class="card-body">
              <div class="photo-frame">
                <img
                  src="extracted_docx_images/ex7_assets/car_frame_test.png"
                  alt="Car"
                  class="car-photo"
                />
              </div>
              <p class="card-copy">Some text inside the first card</p>
            </div>
          </div>
        </div>

        <div class="col">
            <div class="card demo-card card-yellow h-100">
              <div class="card-body">
              <div class="photo-frame">
                <img
                  src="extracted_docx_images/ex7_assets/car_frame_test.png"
                  alt="Car"
                  class="car-photo"
                />
              </div>
              <p class="card-copy">Some text inside the first card</p>
            </div>
          </div>
        </div>

        <div class="col">
            <div class="card demo-card card-red h-100">
              <div class="card-body">
              <div class="photo-frame">
                <img
                  src="extracted_docx_images/ex7_assets/car_frame_test.png"
                  alt="Car"
                  class="car-photo"
                />
              </div>
              <p class="card-copy">Some text inside the first card</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
